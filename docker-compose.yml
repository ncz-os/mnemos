# MNEMOS docker-compose — PostgreSQL profile.
#
# This file provisions a PostgreSQL 16 + pgvector stack with the embedded
# `mnemos serve` runtime. The two enterprise backends (Oracle 23ai and IBM Db2
# 12.1.5) are NOT provisioned here because their container images are vendor-
# distributed (Oracle EE via container-registry.oracle.com; Db2 12.1.5 EAP via
# AESE tarball — see docs/db2-eap-recipe-2026-05-20.md for the build recipe).
#
# To run MNEMOS against Oracle or Db2, either:
#   (a) Bring up the vendor image separately and point MNEMOS at it via
#       MNEMOS_DATABASE_DSN (see `mnemos` service `environment:` block below
#       for the commented-out DSN examples), OR
#   (b) Uncomment and adapt the `oracle-ee` / `db2-eap` profile stubs near
#       the bottom of this file (you must supply the image yourself).
#
# Cross-references:
#   - docs/db2-oracle-ee-test-plan.md  — enterprise-backend test topology
#   - docs/db2-eap-recipe-2026-05-20.md  — Db2 12.1.5 EAP container recipe
#   - docs/oracle-port-status.md  — Oracle 23ai backend status

services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mnemos_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mnemos_local}
      POSTGRES_DB: mnemos
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Migration ordering must match mnemos/installer/db.py::run_migrations()
      # (see EVOLUTION.md "decisions we would revisit" — the two
      # canonical ordering sites must stay in sync until we move to
      # Alembic or sqitch).
      - ./db/0_init_roles_staging.sql:/docker-entrypoint-initdb.d/00-init-roles.sql
      - ./db/migrations.sql:/docker-entrypoint-initdb.d/01-schema.sql
