      - ./db/migrations_v4_2_pantheon_routing_audit.sql:/migrations/51-pantheon-routing-audit.sql:ro
      - ./db/migrations_v5_0_consolidated_at.sql:/migrations/52-consolidated-at.sql:ro
      - ./db/migrations_v5_0_morpheus_extract_run_memories.sql:/migrations/53-morpheus-extract-run-memories.sql:ro
      - ./db/migrations_v5_0_2_artemis_dedup.sql:/migrations/54-artemis-dedup.sql:ro
