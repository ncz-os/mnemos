  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - '11434:11434'
    entrypoint: >
      sh -c "ollama serve & sleep 5 && ollama pull nomic-embed-text && wait"

  mnemos:
    build:
      context: .
      dockerfile: Dockerfile.arm64-cuda
    image: mnemos-os:arm64-cuda
    runtime: nvidia
    command: ["mnemos", "serve"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_USER: mnemos_user
      PG_PASSWORD: ${POSTGRES_PASSWORD:-mnemos_local}
      PG_DATABASE: mnemos
      PG_HOST: postgres
      # MNEMOS_DATABASE_DSN — uncomment ONE to override per-backend env vars.
      # Scheme determines backend (see SPECIFICATION §9.1 / docs/INSTALL.md).
      # MNEMOS_DATABASE_DSN: postgres://mnemos_user:${POSTGRES_PASSWORD:-mnemos_local}@postgres:5432/mnemos
      # MNEMOS_DATABASE_DSN: oracle://MNEMOS:${ORACLE_PASSWORD:-changeme}@oracle-ee:1521/ORCLPDB1
      # MNEMOS_DATABASE_DSN: db2://MNEMOS:${DB2_PASSWORD:-changeme}@db2-eap:50000/MNEMOS
      MNEMOS_EMBED_BACKEND: llamacpp
      MNEMOS_EMBED_GPU_LAYERS: "999"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # On Linux: use http://172.17.0.1:5001 or add --add-host=host.docker.internal:host-gateway
      GRAEAE_URL: ${GRAEAE_URL:-http://host.docker.internal:5001}
      MNEMOS_PROFILE: personal
    ports:
      - '5002:5002'
      # MCP HTTP/SSE transport advertised in README is `mnemos serve mcp-http`
      # on :5004. This compose runs the default REST/MCP-stdio surface on
      # :5002 only; expose 5004 explicitly when running `mnemos serve mcp-http`.
      # - '5004:5004'
    restart: unless-stopped

