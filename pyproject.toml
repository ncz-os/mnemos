[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Intentional split rename: the deploy unit is the built image, not a PyPI mnemos-os dist.
name = "mnemos-core"
version = "6.1.0"
description = "MNEMOS core: agent memory OS base with GDPR right-to-be-forgotten, PERSEPHONE archival, KRONOS recall observability, multi-backend persistence, and multi-worker support"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MNEMOS Contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # <0.137: 0.137 refactored routing to nest included routes under
  # _IncludedRouter, which breaks app.routes introspection the codebase and
  # tests rely on (and the MCP path-wiring check). Pin until adapted.
  "fastapi>=0.115.0,<0.137",
  "uvicorn[standard]>=0.30.0",
  "gunicorn>=22.0.0",
  "starlette>=0.40.0",
  "pydantic>=2.8.0",
  # pydantic-settings: pinned <2.12 because 2.12.0 inverted the
  # precedence rule between `validation_alias` env vars and init
  # kwargs (env was higher; now lower). MNEMOS instantiates
  # `_DatabaseSettings(**db_section)` from TOML and relies on
  # `PG_BACKEND` / `PG_DSN` / etc. env vars to override empty or
  # inherited TOML values. Surfaced 2026-05-08 by the PROTEUS
  # fresh-install barrage (#199); the precedence boundary is
  # exactly between 2.11 (works) and 2.12 (broken). See
  # `tests/test_postgres_embedding_dim.py::test_runtime_settings_pg_backend_overrides_toml_init`.
  # Lift this pin only after verifying the runtime override path
  # still works (or refactoring it to be precedence-agnostic).
  "pydantic-settings>=2.0.0,<2.12",
  "python-multipart>=0.0.9",
  "asyncpg>=0.29.0",
  # NB: psycopg/psycopg2 are deliberately NOT default deps. Both are
  # LGPL-3.0; we keep mnemos's runtime closure on permissive licenses
  # (Apache/MIT/BSD/MPL). The installer's API-key path uses asyncpg
  # if it's a real Postgres + falls back to invoking the operator's
  # psql binary via subprocess (which is the operator's external GPL
  # tool, not bundled with mnemos). Operators who want the psycopg-
  # based installer path can `pip install psycopg[binary]` separately.
  "httpx>=0.27.0",
  # llama-cpp-python: in-process GGUF embedding generation. The runtime
  # loads a GGUF embedding model (nomic-embed-text-v1.5.Q8_0 by default)
  # once per worker and calls create_embedding() without HTTP. Bench
  # 2026-05-21 shows the CPU build at 11-29 rec/s across the fleet;
  # CUDA wheels available at https://abetlen.github.io/llama-cpp-python/whl/cu124/
  # for hosts with NVIDIA GPUs. Architectural decision: in-process only,
  # no Ollama dependency (mem_1779334716543_f8ebd4, operator-locked
  # 2026-05-21).
  "llama-cpp-python>=0.3",
  # Hardware-accelerated embedder backends (OpenVINO/optimum-intel + the
  # transformers/torch HF path) are OPT-IN extras, not base deps, so the core
  # closure stays lean. mnemos/runtime/embedder.py imports them lazily and
  # auto-falls-back to llama-cpp when absent. Install per host:
  #   [openvino] Intel CPU/iGPU/NPU · [cuda] NVIDIA · [amd] AMD ROCm
  "slowapi>=0.1.9",
  "limits>=3.6.0",
  "redis>=5.0.0",
  "python-dotenv>=1.0.0",
  "mcp>=1.0.0,<2",
  # psutil dropped 2026-05-01: zero import sites in mnemos/ source
  # (was a leftover from an earlier health-check experiment).
  "authlib>=1.3.0",
  "itsdangerous>=2.2.0",
  "typer>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/ncz-os/mnemos"
Repository = "https://github.com/ncz-os/mnemos"
Documentation = "https://github.com/ncz-os/mnemos/blob/master/README.md"

[project.optional-dependencies]
docling = ["docling>=2.5.0", "docling-core>=2.0.0", "pillow>=10.0.0"]
# OpenTelemetry tracing. Without this extra, `install_tracing()` is a
# no-op and the tracing middleware passes through unchanged. Install
# via `pip install mnemos-core[tracing]` to ship spans via OTLP/HTTP
# to your collector (Tempo, Honeycomb, Jaeger, etc.).
tracing = [
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
# Structured JSON log rendering via structlog. Enables
# MNEMOS_STRUCTURED_LOGS=true at runtime to opt in. Without this
# extra, install_structured_logging() is a no-op.
structlog = [
  "structlog>=25.0.0",
]
# Prometheus /metrics export. observability.py imports prometheus_client
# soft-optionally: without this extra the /metrics endpoint serves a tiny
# stub and the metrics middleware no-ops. Install for real scrape output.
metrics = [
  "prometheus_client>=0.20.0",
]
sqlite = [
  "aiosqlite>=0.20.0",
  "sqlite-vec>=0.1.6",
]
# v5 feature extras. Core installs stay small; operators select a
# deployment bundle (edge/server/ml/interop/full) or mix bundles.
morpheus = ["numpy>=1.24"]
persephone = ["zstandard>=0.25"]
pantheon = ["mnemos-pantheon>=0.2,<0.3"]
kronos = ["numpy>=1.24"]
kronos-gpu = ["cupy>=12"]
knossos = []
apollo = []
artemis = ["networkx>=3.3", "scipy>=1.11"]
nats = ["nats-py>=2.14.0"]
hot = ["mnemos-hot>=0.2.0"]
knemon = ["mnemos-knemon>=0.1,<0.2"]
# CHARON portability subsystem (MPF + migrate-in adapters + Docling ingestion).
# Default-on in the umbrella + server/full bundles; separable for minimal core.
charon = ["mnemos-charon>=0.1,<0.2"]
edge = [
  "aiosqlite>=0.20.0",
  "sqlite-vec>=0.1.6",
]
# Bundle extras intentionally recurse through mnemos-core[...] and require pip>=21.2/uv, the build toolchain.
server = ["mnemos-core[nats,persephone,pantheon,knemon,graeae,charon]"]
ml = ["mnemos-core[morpheus,kronos,apollo,artemis,hot]"]
interop = ["mnemos-core[knossos]"]
# Feature-layer extras. The hive build fabric is a separate ncz-os/hive track
# and is not an installable mnemos-core split distribution.
graeae = ["mnemos-graeae>=0.1,<0.2"]
full = [
  "mnemos-core[morpheus,persephone,kronos,knossos,apollo,artemis,nats,hot,edge]",
  "mnemos-pantheon>=0.2,<0.3",
  "mnemos-knemon>=0.1,<0.2",
  "mnemos-graeae>=0.1,<0.2",
  "mnemos-charon>=0.1,<0.2",
]
# Enterprise backend drivers (feat/oracle-port branch). oracledb uses thin
# mode by default — no Oracle Instant Client required. ibm_db pulls the
# DB2 CLI driver as part of its build; on platforms without a pre-built
# wheel, install the IBM DSN client first.
oracle = ["oracledb>=4.0.1"]  # async pool + VECTOR support; thin mode default; tested with 4.0.1
db2 = ["ibm_db>=3.2.4"]  # ibm_db_dbi + Db2 CLI driver build
# MySQL 9.0+ backend (aiomysql async driver). MySQL 9.0 is required for
# native VECTOR columns and VECTOR_DISTANCE / TO_VECTOR functions.
# MariaDB does NOT support native VECTOR in mainline 11.x — use MySQL 9.0+.
mysql = ["aiomysql>=0.2.0"]
# Enterprise bundle — all three enterprise drivers suitable for hosts that
# need to pick a backend at runtime via MNEMOS_DATABASE_DSN.
enterprise = ["mnemos-core[oracle,db2,mysql]"]
# [semantic] — optional semantic-similarity quality scoring.
# fastembed uses ONNX runtime (~10-20 MB), supports the same
# MiniLM/Nomic embedding family as sentence-transformers, and pulls
# NO torch / nvidia / transformers / safetensors weight.
semantic = ["fastembed>=0.3.0"]
# [gpu] — GPU acceleration for the ML embedding path. Default
# is fastembed-gpu (ONNX CUDA execution provider) which works
# with a system CUDA install but does NOT require the torch
# CUDA wheel chain. Operators on systems WITHOUT NVIDIA CUDA
# (Apple Silicon, Intel iGPU, Tegra, ARM) should NOT install
# this extra — install [semantic] (CPU) or [phi] (Intel iGPU) instead.
gpu = ["fastembed-gpu>=0.3.0"]
# [phi] — Intel-iGPU-accelerated path: OpenVINO + FastEmbed, used
# in production at PYTHIA. Apache-2.0 across the board, no torch.
phi = ["openvino-genai>=2024.4.0", "fastembed>=0.3.0"]
# ── In-process embedder hardware acceleration (mnemos/runtime/embedder.py) ──
# The base install ships only llama-cpp-python (portable CPU GGUF); the embedder
# auto-falls-back to it everywhere. None of these accel backends are required
# for a working core — they are opt-in so the base closure stays lean
# (no ~5GB torch/CUDA/OpenVINO chain pulled by default).
#
# [openvino] — Intel CPU/iGPU/NPU via optimum-intel OVModelForFeatureExtraction.
# Pulls transformers (+ CPU torch transitively) for tokenizer/export plumbing.
openvino = ["openvino>=2025.0", "optimum-intel[openvino]>=1.20", "transformers>=4.40"]
# [cuda] — NVIDIA. The HF/transformers embedder path needs the CUDA torch wheel;
# install with the PyTorch CUDA index, e.g.:
#   pip install mnemos-core[cuda] --extra-index-url https://download.pytorch.org/whl/cu124
# For the default llama-cpp path on NVIDIA, install the CUDA-built wheel from
#   https://abetlen.github.io/llama-cpp-python/whl/cu124/
cuda = ["torch>=2.3", "transformers>=4.40"]
# [amd] — AMD ROCm. Same HF/torch path against the ROCm index, e.g.:
#   pip install mnemos-core[amd] --extra-index-url https://download.pytorch.org/whl/rocm6.2
# For llama-cpp on AMD, build the HIPBLAS/Vulkan wheel (or use the MEDUSA HTTP
# embed backend). torch ROCm wheels are linux-only.
amd = ["torch>=2.3", "transformers>=4.40"]
dev = [
  "import-linter>=2.0.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
# Entry points that land in PATH after `pip install mnemos-core`. The installer
# can then be invoked as `mnemos-install` without needing install.py on the
# filesystem.
mnemos = "mnemos.cli.main:app"
mnemos-install = "mnemos.installer.__main__:main"
refresh-pantheon-catalog = "mnemos.tools.refresh_pantheon_catalog:main"

[tool.setuptools]
# Ship every file listed in MANIFEST.in (SQL migrations, config example,
# systemd unit) into the sdist.
include-package-data = true

[tool.setuptools.package-data]
"mnemos.db_migrations" = ["*.sql", "**/*.sql"]

[tool.setuptools.packages.find]
# Include the coherent v4 Python package tree. Top-level db/ remains a SQL
# migrations directory and is shipped via MANIFEST.in, not as a Python package.
include = [
  "mnemos*",
]
namespaces = true

# uv: fast Python package installer for Docker builds
# Install with: curl -LsSf https://astral.sh/uv/install.sh | sh
# Note: uv does not support python-version in [tool.uv] (use pyproject.toml requires-python instead)
# For Docker: use `uv pip install --system -r requirements.txt` (--system is required when no venv exists)

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  "archive",
  "venv",
  ".venv",
  "dist",
  "build",
  "mnemos/tools/export_memories_for_docling.py",  # generated helper
  "services",  # WIP routing-engine scaffold; not part of the mnemos package
]

[tool.ruff.lint]
# Select E+F+W explicitly rather than relying on ruff's default.
#
# This used to be implicit, with a comment noting "default select is E+F+W".
# That was true of the ruff we happened to resolve, but newer ruff broadened
# its defaults, so an unpinned `ruff>=0.5.0` silently started enforcing rule
# families this codebase has never adopted (I001, RET, DTZ, RUF, UP): 2971
# errors appeared with no source change. The old behaviour was only being
# preserved by a stale cached virtualenv pinning an old ruff — once .venv
# stopped being cached, the lint gate broke.
#
# Naming the families makes the gate reproducible on any ruff version.
# Adopting further rule sets should be a deliberate, separate change.
select = ["E", "F", "W"]
ignore = [
  "E402",  # module-level import not at top — legit with sys.path.insert + conditional imports
  "E501",  # line-too-long — we set line-length above; trust that
  "F541",  # f-string without placeholders — cosmetic noise
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files legitimately re-export symbols
"**/__init__.py" = ["F401"]
# Installer uses string forward references to lazily-imported Config
"mnemos/installer/__main__.py" = ["F821"]

[tool.importlinter]
root_package = "mnemos"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "mnemos layered architecture"
type = "layers"
layers = [
  "mnemos.api",
  "mnemos.domain",
  "mnemos.db",
  "mnemos.persistence",
  "mnemos.core",
]
ignore_imports = [
  # lifecycle.py is the composition root: it wires the persistence backends at
  # startup (cf. the importlib.import_module calls for postgres/sqlite/oracle/
  # db2/mysql in the same file). The layered-install fail-fast guard is the one
  # static import of that set; tolerate it like the dynamic siblings.
  "mnemos.core.lifecycle -> mnemos.persistence.base",
]

[[tool.importlinter.contracts]]
name = "api routes use domain, not db"
type = "forbidden"
source_modules = ["mnemos.api.routes"]
forbidden_modules = ["mnemos.db"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "domain modules are siblings"
type = "independence"
modules = [
  "mnemos.domain.compression",
  "mnemos.domain.morpheus",
  "mnemos.domain.memory_categorization",
  "mnemos.domain.openai_compat",
]
ignore_imports = [
]

[[tool.importlinter.contracts]]
name = "mcp does not call route handlers as functions"
type = "forbidden"
source_modules = ["mnemos.mcp"]
forbidden_modules = ["mnemos.api.routes"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "webhooks does not couple to domain"
type = "independence"
modules = ["mnemos.webhooks", "mnemos.domain"]

[[tool.importlinter.contracts]]
name = "persistence has no upward deps"
type = "forbidden"
source_modules = ["mnemos.persistence"]
forbidden_modules = [
  "mnemos.api",
  "mnemos.domain",
  "mnemos.mcp",
  "mnemos.webhooks",
  "mnemos.workers",
]

[[tool.importlinter.contracts]]
name = "core does not import api/domain/db/webhooks/mcp/etc"
type = "forbidden"
source_modules = ["mnemos.core"]
forbidden_modules = [
  "mnemos.api",
  "mnemos.domain",
  "mnemos.db",
  "mnemos.webhooks",
  "mnemos.mcp",
  "mnemos.workers",
  "mnemos.cli",
  "mnemos.tools",
  "mnemos.installer",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Note on tests/integration_nats/: those tests require a live NATS
# broker (MNEMOS_NATS_TEST_URL). They are NOT in addopts ignore
# here on purpose — pytest's --ignore short-circuits collection
# BEFORE conftest hooks run, so an explicit `pytest tests/
# integration_nats/` would silently collect zero tests if we
# kept the ignore. Instead, the conftest in that directory uses
# pytest_collection_modifyitems to mark every collected test as
# skipped when MNEMOS_NATS_TEST_URL is unset — default `pytest`
# stays green without skipping a directory by name.
addopts = "--ignore=tests/test_live_e2e.py"
markers = [
  "integration: integration tests requiring MNEMOS_TEST_DB (postgres://...)",
]
