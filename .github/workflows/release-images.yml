name: Publish image matrix (ghcr.io)

# Publishes the layered MNEMOS image matrix to ghcr.io:
#
#   ghcr.io/<owner>/mnemos-core         base kernel            amd64 + arm64
#   ghcr.io/<owner>/mnemos              everything API image   amd64 + arm64
#   ghcr.io/<owner>/mnemos-enterprise   + Oracle/Db2/MySQL     amd64 ONLY
#
# (mnemos-stiphos is published from its own repo's workflow — it is a separate
# service, not part of this umbrella.)
#
# Composition is OCI-layered: mnemos is built FROM mnemos-core, and
# mnemos-enterprise FROM mnemos, each by immutable digest. The heavy base
# (llama-cpp-python compile + baked GGUF embedder) is built once and shared.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      addon_ref:
        description: 'Add-on branch/tag/SHA for pantheon/knemon/graeae/charon (default: main)'
        required: false
        default: 'main'
      build_enterprise:
        description: 'Also build the amd64-only enterprise image'
        type: boolean
        required: false
        default: true

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  ADDON_REMOTE_BASE: https://gitlab.com/ncz-os
  ADDON_REF: ${{ github.event.inputs.addon_ref || 'main' }}

jobs:
  # ── 1. base kernel ─────────────────────────────────────────────────────────
  core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # NOTE: arm64 here builds under QEMU emulation, which makes the
      # llama-cpp-python compile slow (tens of minutes). If build minutes
      # become a problem, split this into a native matrix
      # (ubuntu-latest + ubuntu-24.04-arm) that pushes by digest and merges
      # the manifest — only THIS job needs it; the layers below are cheap.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/mnemos-core
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.core
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MNEMOS_CORE_REF=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mnemos-core
          cache-to: type=gha,mode=max,scope=mnemos-core
          provenance: true
          sbom: true

  # ── 2. everything API image (FROM mnemos-core) ─────────────────────────────
  everything:
    needs: core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pre-build the four add-on wheels from their GitLab repos and stage them
      # into ./wheelhouse for Dockerfile.everything. They are pure-Python
      # (setuptools) so --no-deps wheel builds need no native toolchain and the
      # same wheel is arch-independent for both target platforms.
      #
      # Reproducibility: tagged releases must pin the add-on source to a
      # known SHA, NOT the mutable ``main`` branch. ``.github/addons.lock.json``
      # records one commit id per overlay; the CI checks them out detached
      # and records the resolved SHA in ``addon-provenance.txt`` so the
      # docker build can stamp it into OCI image labels (one per overlay).
      # Operator workflow: bump a SHA in addons.lock.json + tag ``vX.Y.Z``
      # and the image published at that tag is exactly the add-on source
      # pinned in the lock -- never ``main``, never the branch tip.
      - name: Stage add-on wheels
        env:
          ADDON_GIT_TOKEN: ${{ secrets.ADDON_GIT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          base="${ADDON_REMOTE_BASE}"
          if [ -n "${ADDON_GIT_TOKEN:-}" ]; then
            base="https://oauth2:${ADDON_GIT_TOKEN}@gitlab.com/ncz-os"
          fi

          # Resolve the SHA each overlay should be pinned to. For tagged
          # releases we use .github/addons.lock.json so the published image
          # is reproducible from a known commit. For non-tagged (dev)
          # pushes we fall back to ``${ADDON_REF}`` so contributors can
          # iterate without editing the lock on every change.
          is_tag="${GITHUB_REF_TYPE:-}"
          if [ "${is_tag}" = "tag" ] && [ -f .github/addons.lock.json ]; then
            LOCK="$(jq -c '.' .github/addons.lock.json)"
            echo "── pinning add-on wheels to .github/addons.lock.json ──"
          else
            LOCK=""
            echo "── not a tag push; using ADDON_REF=${ADDON_REF} (mutable) ──"
          fi

          for name in pantheon knemon graeae charon; do
             if [ -n "${LOCK}" ]; then
               pin="$(echo "${LOCK}" | jq -r --arg k "${name}" '.[$k] // empty')"
               if [ -z "${pin}" ] || [ "${pin}" = "null" ]; then
                 echo "::error::.github/addons.lock.json has no entry for ${name}; refusing to ship a v*.*.* tag without a per-overlay SHA pin."
                 exit 1
               fi
               # Fetch the pinned SHA detached so a stray branch push can
               # never change what ships under this tag.
               git init -q "src-${name}"
               ( cd "src-${name}" \
                   && git remote add origin "${base}/${name}.git" \
                   && git fetch --depth 1 origin "${pin}" \
                   && git checkout --quiet --detach FETCH_HEAD \
                   && echo "${name} $(git rev-parse HEAD)" >> "${GITHUB_WORKSPACE}/addon-provenance.txt" )
             else
               ref="${ADDON_REF}"
               git clone --depth 1 --branch "${ref}" "${base}/${name}.git" "src-${name}"
               ( cd "src-${name}" && echo "${name} $(git rev-parse HEAD)" >> "${GITHUB_WORKSPACE}/addon-provenance.txt" )
             fi
             echo "::group::wheel ${name}"
             python -m pip wheel --no-deps --no-build-isolation --wheel-dir wheelhouse "./src-${name}"
             echo "::endgroup::"
          done
          echo "── staged wheels ──"; ls -1 wheelhouse
          echo "── addon provenance (one SHA per overlay) ──"
          cat addon-provenance.txt

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/mnemos
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Translate ``addon-provenance.txt`` (one ``overlay SHA`` line per
      # add-on) into per-overlay OCI image labels so the published image
      # records the exact commit each overlay was built from. Without
      # this, a ``v1.2.3`` tag could not be reproduced and a downstream
      # consumer has no way to tell whether a given image was built
      # from main or from a pinned commit.
      - id: addon-labels
        run: |
          set -euo pipefail
          {
            echo "labels<<EOF"
            while read -r name sha; do
              [ -z "${name:-}" ] && continue
              echo "org.opencontainers.image.source.${name}=${sha}"
            done < addon-provenance.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.everything
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MNEMOS_CORE_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/mnemos-core@${{ needs.core.outputs.digest }}
            MNEMOS_CORE_REF=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            ${{ steps.addon-labels.outputs.labels }}
          cache-from: type=gha,scope=mnemos-everything
          cache-to: type=gha,mode=max,scope=mnemos-everything
          provenance: true
          sbom: true

  # ── 3. enterprise image (FROM mnemos) — amd64 ONLY ─────────────────────────
  enterprise:
    needs: everything
    if: ${{ github.event_name == 'push' || github.event.inputs.build_enterprise == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/mnemos-enterprise
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.enterprise
          # amd64-only by policy (ibm_db has no reliable arm64 wheel).
          platforms: linux/amd64
          push: true
          build-args: |
            MNEMOS_EVERYTHING_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/mnemos@${{ needs.everything.outputs.digest }}
            MNEMOS_CORE_REF=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mnemos-enterprise
          cache-to: type=gha,mode=max,scope=mnemos-enterprise
          provenance: true
          sbom: true

  summary:
    needs: [core, everything, enterprise]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "### MNEMOS image matrix"
            echo ""
            echo "| Image | Arch | Status |"
            echo "|---|---|---|"
            echo "| mnemos-core | amd64+arm64 | ${{ needs.core.result }} |"
            echo "| mnemos (everything) | amd64+arm64 | ${{ needs.everything.result }} |"
            echo "| mnemos-enterprise | amd64 | ${{ needs.enterprise.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
