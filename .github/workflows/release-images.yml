name: Publish mnemos-enterprise (ghcr.io)

# Publishes the one supported MNEMOS container package to ghcr.io:
#
#   ghcr.io/<owner>/mnemos-enterprise   amd64 + arm64
#
# The core and everything layers remain separate Dockerfiles and BuildKit Bake
# targets, but are passed between targets as in-memory named contexts. They are
# never pushed or tagged. Only the final per-arch enterprise images are pushed
# by digest, then merged into the tagged multi-arch release manifest.
#
# The native per-architecture matrix is load-bearing: Dockerfile.core compiles
# architecture-specific extensions and deliberately refuses emulation.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      addon_ref:
        description: 'Add-on branch/tag/SHA for pantheon/knemon/graeae/charon (default: main)'
        required: false
        default: 'main'
      build_enterprise:
        description: 'Build and publish the mnemos-enterprise image'
        type: boolean
        required: false
        default: true

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mnemos-enterprise
  ADDON_REMOTE_BASE: https://gitlab.com/ncz-os
  ADDON_REF: ${{ github.event.inputs.addon_ref || 'main' }}

jobs:
  # Build the full core -> everything -> enterprise chain once per architecture
  # on a native runner. Bake's target contexts preserve the Dockerfile layering
  # without registry round-trips for core or everything.
  build:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_enterprise == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # wheelhouse/ and src-* are created below for Dockerfile.everything, but
      # Dockerfile.core copies its entire context into /app. Archive the exact
      # checked-out commit so those staging files cannot leak into the core
      # layer when all three Dockerfiles share one Bake solve.
      - name: Prepare clean core context
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/mnemos-core-context"
          git archive "${GITHUB_SHA}" | tar -x -C "${RUNNER_TEMP}/mnemos-core-context"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # setup-python's 3.13 environment does not ambiently include
      # setuptools the way 3.11's did (CPython 3.12+ dropped bundled
      # distutils and pip stopped assuming setuptools is present). The
      # add-on wheel builds below use --no-build-isolation, which relies
      # on setuptools already being importable in this environment --
      # without this step, `pip wheel` fails with
      # `BackendUnavailable: Cannot import 'setuptools.build_meta'`.
      - name: Ensure setuptools is present for --no-build-isolation wheel builds
        run: python -m pip install --upgrade pip setuptools wheel

      # Pre-build the four add-on wheels from their GitLab repos and stage them
      # into ./wheelhouse for Dockerfile.everything. They are pure-Python
      # (setuptools) so --no-deps wheel builds need no native toolchain and the
      # same wheel is arch-independent for both target platforms.
      #
      # Reproducibility: tagged releases must pin the add-on source to a
      # known SHA, NOT the mutable ``main`` branch. ``.github/addons.lock.json``
      # records one commit id per overlay; the CI checks them out detached
      # and records the resolved SHA in ``addon-provenance.txt`` so the
      # docker build can stamp it into OCI image labels (one per overlay).
      # Operator workflow: bump a SHA in addons.lock.json + tag ``vX.Y.Z``
      # and the image published at that tag is exactly the add-on source
      # pinned in the lock -- never ``main``, never the branch tip.
      - name: Stage add-on wheels
        env:
          ADDON_GIT_TOKEN: ${{ secrets.ADDON_GIT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          base="${ADDON_REMOTE_BASE}"
          if [ -n "${ADDON_GIT_TOKEN:-}" ]; then
            base="https://oauth2:${ADDON_GIT_TOKEN}@gitlab.com/ncz-os"
          fi

          # Resolve the SHA each overlay should be pinned to. For tagged
          # releases we use .github/addons.lock.json so the published image
          # is reproducible from a known commit. For non-tagged (dev)
          # pushes we fall back to ``${ADDON_REF}`` so contributors can
          # iterate without editing the lock on every change.
          is_tag="${GITHUB_REF_TYPE:-}"
          if [ "${is_tag}" = "tag" ] && [ -f .github/addons.lock.json ]; then
            LOCK="$(jq -c '.' .github/addons.lock.json)"
            echo "── pinning add-on wheels to .github/addons.lock.json ──"
          elif [ "${is_tag}" = "tag" ]; then
            # A version tag must NEVER build overlays from a mutable ref:
            # the tag is the reproducibility contract. If the lock file is
            # missing (tag cut before it was committed, or deleted), refuse
            # to publish rather than silently shipping the branch tip under
            # a version tag.
            echo "::error::tagged release is missing .github/addons.lock.json; refusing to build add-on wheels from the mutable \`${ADDON_REF}\` ref for a version tag."
            exit 1
          else
            LOCK=""
            echo "── not a tag push; using ADDON_REF=${ADDON_REF} (mutable) ──"
          fi

          for name in pantheon knemon graeae charon; do
             if [ -n "${LOCK}" ]; then
               pin="$(echo "${LOCK}" | jq -r --arg k "${name}" '.[$k] // empty')"
               if [ -z "${pin}" ] || [ "${pin}" = "null" ]; then
                 echo "::error::.github/addons.lock.json has no entry for ${name}; refusing to ship a v*.*.* tag without a per-overlay SHA pin."
                 exit 1
               fi
               # Validate the shape, not just presence. The lock shipped with
               # all-zero placeholder SHAs, which are non-empty and non-null,
               # so they passed the check above and went straight to
               # `git fetch origin 0000...` -- an unresolvable object. Every
               # tagged publish would fail here, but only AFTER the expensive
               # base image finished building. Fail fast and say why instead.
               case "${pin}" in
                 *[!0-9a-f]* | "" ) echo "::error::${name} pin '${pin}' is not a lowercase hex SHA."; exit 1 ;;
               esac
               if [ "${#pin}" -ne 40 ]; then
                 echo "::error::${name} pin '${pin}' is ${#pin} chars; expected a full 40-character SHA."
                 exit 1
               fi
               if [ "${pin}" = "0000000000000000000000000000000000000000" ]; then
                 echo "::error::${name} is still the all-zero placeholder in .github/addons.lock.json. Replace it with the commit this release should ship."
                 exit 1
               fi
               # Fetch the pinned SHA detached so a stray branch push can
               # never change what ships under this tag.
               git init -q "src-${name}"
               ( cd "src-${name}" \
                   && git remote add origin "${base}/${name}.git" \
                   && git fetch --depth 1 origin "${pin}" \
                   && git checkout --quiet --detach FETCH_HEAD \
                   && echo "${name} $(git rev-parse HEAD)" >> "${GITHUB_WORKSPACE}/addon-provenance.txt" )
             else
               ref="${ADDON_REF}"
               git clone --depth 1 --branch "${ref}" "${base}/${name}.git" "src-${name}"
               ( cd "src-${name}" && echo "${name} $(git rev-parse HEAD)" >> "${GITHUB_WORKSPACE}/addon-provenance.txt" )
             fi
             echo "::group::wheel ${name}"
             python -m pip wheel --no-deps --no-build-isolation --wheel-dir wheelhouse "./src-${name}"
             echo "::endgroup::"
          done
          echo "── staged wheels ──"; ls -1 wheelhouse
          echo "── addon provenance (one SHA per overlay) ──"
          cat addon-provenance.txt

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Translate ``addon-provenance.txt`` (one ``overlay SHA`` line per
      # add-on) into per-overlay OCI image labels so the published image
      # records the exact commit each overlay was built from. Without
      # this, a ``v1.2.3`` tag could not be reproduced and a downstream
      # consumer has no way to tell whether a given image was built
      # from main or from a pinned commit.
      - id: addon-labels
        run: |
          set -euo pipefail
          {
            echo "labels<<EOF"
            while read -r name sha; do
              [ -z "${name:-}" ] && continue
              echo "org.opencontainers.image.source.${name}=${sha}"
            done < addon-provenance.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: core-meta
        uses: docker/metadata-action@v5
        with:
          bake-target: core-metadata
          images: ${{ env.IMAGE_NAME }}

      - id: everything-meta
        uses: docker/metadata-action@v5
        with:
          bake-target: everything-metadata
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: ${{ steps.addon-labels.outputs.labels }}

      - id: enterprise-meta
        uses: docker/metadata-action@v5
        with:
          bake-target: enterprise-metadata
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # BuildKit target contexts let each existing Dockerfile consume the
      # previous target directly. Only enterprise has an image exporter.
      - name: Define layered build
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/mnemos-bake.hcl" <<'EOF'
          variable "PLATFORM" { default = "" }
          variable "SLUG" { default = "" }
          variable "CORE_CONTEXT" { default = "" }
          variable "MNEMOS_CORE_REF" { default = "unknown" }
          variable "IMAGE_NAME" { default = "" }

          target "core-metadata" {}
          target "everything-metadata" {}
          target "enterprise-metadata" {}

          target "core" {
            inherits = ["core-metadata"]
            context = CORE_CONTEXT
            dockerfile = "Dockerfile.core"
            platforms = [PLATFORM]
            args = {
              MNEMOS_CORE_REF = MNEMOS_CORE_REF
            }
            cache-from = ["type=gha,scope=mnemos-core-${SLUG}"]
            cache-to = ["type=gha,mode=max,scope=mnemos-core-${SLUG}"]
            attest = ["type=provenance", "type=sbom"]
          }

          target "everything" {
            inherits = ["everything-metadata"]
            context = "."
            dockerfile = "Dockerfile.everything"
            contexts = {
              "mnemos-core-build" = "target:core"
            }
            platforms = [PLATFORM]
            args = {
              MNEMOS_CORE_IMAGE = "mnemos-core-build"
              MNEMOS_CORE_REF = MNEMOS_CORE_REF
            }
            cache-from = ["type=gha,scope=mnemos-everything-${SLUG}"]
            cache-to = ["type=gha,mode=max,scope=mnemos-everything-${SLUG}"]
            attest = ["type=provenance", "type=sbom"]
          }

          target "enterprise" {
            inherits = ["enterprise-metadata"]
            context = "."
            dockerfile = "Dockerfile.enterprise"
            contexts = {
              "mnemos-everything-build" = "target:everything"
            }
            platforms = [PLATFORM]
            args = {
              MNEMOS_EVERYTHING_IMAGE = "mnemos-everything-build"
              MNEMOS_CORE_REF = MNEMOS_CORE_REF
            }
            cache-from = ["type=gha,scope=mnemos-enterprise-${SLUG}"]
            cache-to = ["type=gha,mode=max,scope=mnemos-enterprise-${SLUG}"]
            attest = ["type=provenance", "type=sbom"]
            output = ["type=image,name=${IMAGE_NAME},push-by-digest=true,name-canonical=true,push=true"]
          }
          EOF

      - id: bake
        name: Build layered enterprise image by digest
        uses: docker/bake-action@v6
        env:
          PLATFORM: ${{ matrix.platform }}
          SLUG: ${{ matrix.slug }}
          CORE_CONTEXT: ${{ runner.temp }}/mnemos-core-context
          MNEMOS_CORE_REF: ${{ github.sha }}
        with:
          source: .
          files: |
            ${{ runner.temp }}/mnemos-bake.hcl
            ${{ steps.core-meta.outputs.bake-file-labels }}
            ${{ steps.everything-meta.outputs.bake-file-labels }}
            ${{ steps.enterprise-meta.outputs.bake-file-labels }}
          targets: enterprise
          allow: fs.read=${{ runner.temp }}/mnemos-core-context

      - id: build
        name: Resolve enterprise digest
        env:
          BUILD_METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          digest="$(jq -er '.enterprise["containerimage.digest"]' <<< "$BUILD_METADATA")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Artifact filenames omit the sha256: prefix because colons are invalid.
      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge the two final enterprise digests into the tagged public manifest.
  #
  # Multi-arch as of 2026-09-10. Previously amd64-only on the (incorrect)
  # assumption that Oracle needed gating for the same reason Db2 does; real
  # arm64 hardware verification that day (O6N, including a live query
  # against PYTHIA's production Oracle DB) showed oracledb and aiomysql both
  # work fine on arm64. Only ibm_db (Db2) is genuinely amd64-only — see the
  # policy note in Dockerfile.enterprise, which installs it conditionally on
  # TARGETARCH so the two platform builds merge into one manifest list where
  # the arm64 leg simply lacks the Db2 backend.
  enterprise:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: enterprise-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create tagged manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          ls -1 | sed 's/^/  leg: /'
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Verify published manifest
        run: |
          set -euo pipefail
          tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          digest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "published manifest: $tag -> $digest"
          docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' \
            | jq -r '.manifests[]? | "  platform: \(.platform.os)/\(.platform.architecture)"'

  summary:
    needs: [build, enterprise]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "### MNEMOS enterprise image"
            echo ""
            echo "Core and everything were internal BuildKit targets; neither was pushed or tagged."
            echo ""
            echo "| Published image | Arch | Build | Manifest |"
            echo "|---|---|---|---|"
            echo "| mnemos-enterprise | amd64+arm64 (db2 on amd64 only) | ${{ needs.build.result }} | ${{ needs.enterprise.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
