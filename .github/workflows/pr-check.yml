name: PR check (lint + unit)

# Slim PR-only check so external contributors get green/red signal on
# their PRs. The full pipeline (lint + unit + integration with real
# pgvector + build) lives on GitLab and runs on master merges.
# See ~/.claude/rules/gitlab-ci-policy.md or MNEMOS memory
# "gitlab ci policy" for the fleet pattern.

on:
  pull_request:
    branches: [master, main, v3.5-dev]

jobs:
  lint-and-unit:
    name: ruff + pytest unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Lint env discipline
        run: |
          # Runtime environment reads must route through mnemos/core/config.py.
          # Allowed exceptions:
          #   - mnemos/installer/* runs before package configuration exists.
          #   - tests/* may set process environment for test isolation (outside mnemos/).
          python - <<'PY'
          import re
          import subprocess
          import sys

          base = "${{ github.event.pull_request.base.sha }}"
          head = "${{ github.event.pull_request.head.sha }}"
          proc = subprocess.run(
              [
                  "git",
                  "diff",
                  "--unified=0",
                  "--diff-filter=ACMRT",
                  base,
                  head,
                  "--",
                  "mnemos",
                  ":(exclude)mnemos/core/config.py",
                  ":(exclude)mnemos/installer",
              ],
              check=True,
              text=True,
              stdout=subprocess.PIPE,
          )
          forbidden = re.compile(r"(^|[^A-Za-z0-9_])_?os\.(environ|getenv)")
          path = "<unknown>"
          violations: list[str] = []
          for raw in proc.stdout.splitlines():
              if raw.startswith("+++ b/"):
                  path = raw.removeprefix("+++ b/")
                  continue
              if raw.startswith("+") and not raw.startswith("+++") and forbidden.search(raw[1:]):
                  violations.append(f"{path}: {raw[1:]}")
          if violations:
              print("Forbidden new os.environ/os.getenv usage outside mnemos/core/config.py or mnemos/installer/.")
              print("\n".join(violations))
              sys.exit(1)
          PY

      - name: Lint imports
        run: .venv/bin/lint-imports --config pyproject.toml

      - name: Unit tests
        run: .venv/bin/pytest tests/ --tb=short --ignore=tests/test_live_e2e.py -q
