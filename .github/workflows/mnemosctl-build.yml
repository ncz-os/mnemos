name: mnemosctl build matrix

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "cli/mnemosctl/**"
      - ".github/workflows/mnemosctl-build.yml"
  pull_request:
    paths:
      - "cli/mnemosctl/**"

defaults:
  run:
    working-directory: cli/mnemosctl

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --target ${{ matrix.target }} -- -D warnings
        env:
          # aarch64-linux on ubuntu-24.04 needs cross-linker
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }}

      - name: smoke
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          ./target/${{ matrix.target }}/release/mnemosctl --version
          ./target/${{ matrix.target }}/release/mnemosctl --help

      - name: artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnemosctl-${{ matrix.target }}
          path: cli/mnemosctl/target/${{ matrix.target }}/release/mnemosctl*
          if-no-files-found: ignore
