global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout check 5s

listen mnemos-postgres-primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server pythia 192.0.2.67:5433 check port 8008 check-ssl verify required ca-file /etc/mnemos/tls/ca.crt crt /etc/mnemos/tls/client.pem
    server cerberus 192.0.2.96:5434 check port 8008 check-ssl verify required ca-file /etc/mnemos/tls/ca.crt crt /etc/mnemos/tls/client.pem

listen mnemos-postgres-replicas
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server pythia 192.0.2.67:5433 check port 8008 check-ssl verify required ca-file /etc/mnemos/tls/ca.crt crt /etc/mnemos/tls/client.pem
    server cerberus 192.0.2.96:5434 check port 8008 check-ssl verify required ca-file /etc/mnemos/tls/ca.crt crt /etc/mnemos/tls/client.pem

listen patroni-stats
    bind 127.0.0.1:7000
    mode http
    stats enable
    stats auth "admin:${MNEMOS_PATRONI_PASSWORD}"
    stats uri /stats
    stats refresh 10s
