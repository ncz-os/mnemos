# Run: pre-commit install
# After that, every `git commit` auto-runs ruff/ruff-format before the commit lands.
# Matches the CI Lint + Test / Lint (ruff) step so pushes don't surprise-fail CI.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  # Migration parity gate (mnemos-migration-parity-ci-gate)
  # Any new .sql under db/migrations/ OR db/migrations_oracle/ OR
  # db/migrations_db2/ must have parallel files in all three dirs
  # or the commit is rejected. Pre-commit uses --mode staged (only
  # blocks new additions); CI runs --mode full as a clean inventory gate.
  - repo: local
    hooks:
      - id: migration-parity-check
        name: migration-parity-check
        entry: python3 scripts/check_migration_parity.py --mode staged
        language: system
        pass_filenames: false
        files: ^db/migrations(_oracle|_db2)?/.*\.sql$
