# MNEMOS GitLab CI
#
# Posture: ARGONAS (canonical) > GitLab (active dev + CI) > GitHub (publish + contrib).
# This pipeline runs on every push to master and on merge requests.
#
# Stages:
#   - lint:   ruff (the test the GitHub mirror has been failing on for days)
#   - test:   pytest unit tests + integration tests against real Postgres + pgvector
#   - build:  docker image build (publishing handled separately, see release-docker)
#   - release: platform-native single-binary artifacts for tagged releases
#
# The integration job is the high-leverage win over the previous GitHub CI:
# it runs the suite against a real pgvector-enabled Postgres so the FakePool
# substring-matcher gaps caught in the v3.0 audit pass can no longer reach
# master.

default:
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      # NOTE: .venv is deliberately NOT cached.
      #
      # It used to be, and it caused intermittent, misleading failures: a
      # partially-restored cache ("Failed to extract cache") leaves a .venv
      # that is present but incomplete. `python3 -m venv .venv` does not
      # clear an existing directory, and `pip install -e .` then sees the
      # project as already satisfied and skips re-resolving dependencies —
      # so the missing module is never reinstalled.
      #
      # The symptom was a core dependency vanishing at random. It surfaced
      # as tests/test_connector_smoke.py failing with
      # "McpError: Connection closed", because the stdio subprocess died on
      # "ModuleNotFoundError: No module named 'httpx'" — httpx is a core
      # dependency and should never be absent. Re-running the identical
      # commit passed.
      #
      # Caching .cache/pip keeps the speed benefit (wheels are not
      # re-downloaded) without the correctness hazard, since the venv is
      # rebuilt from those cached wheels every job.
      - .cache/pip
  before_script:
    # Policy-injected security analyzers (SAST / secret-detection /
    # dependency-scanning / etc.) run in their own analyzer images and inherit
    # this default before_script. Those images may lack python3 or cannot
    # resolve heavy optional deps like openvino, and they do not need our venv
    # to scan — so skip the venv build for them and let the analyzer's own
    # script run. Project jobs (lint:* / test:* / release:*) do not match these
    # patterns and keep identical behavior.
    - |
      case "$CI_JOB_NAME" in
        *sast*|*secret-detection*|*dependency-scanning*|*container-scanning*|*dast*|*license-scanning*|*api-fuzzing*|*coverage-fuzzing*)
          echo "security analyzer job ($CI_JOB_NAME) — skipping venv setup"
          ;;
        *)
          # --clear so a stray or partially-restored .venv is rebuilt rather
          # than silently reused with missing packages (see cache note above).
          python3 -m venv --clear .venv
          # sqlite (aiosqlite) is the default backend's async driver and nats
          # drives the publisher tests; the unit suite needs both or ~27 tests
          # fail on missing core drivers. persephone (zstandard) is needed at
          # *collection* time -- tests/test_worker_lifecycle_backends.py imports
          # mnemos.domain.persephone.runner at module scope, and the package
          # raises from require_extra() when the extra is absent. pytest treats
          # that as a collection error and aborts the entire run, so one missing
          # pure-Python dependency silently reduced the whole unit suite to
          # "7 skipped, 1 error".
          .venv/bin/pip install --cache-dir=.cache/pip -q -e ".[dev,sqlite,nats,persephone]"
          export PATH="$CI_PROJECT_DIR/.venv/bin:$PATH"
          ;;
      esac

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Minimum coverage gate — start permissive, ratchet up over time.
  COVERAGE_FAIL_UNDER: "0"

stages:
  - lint
  - test
  - build
  - release

# ---- lint --------------------------------------------------------------

lint:ruff:
  stage: lint
  tags: [argos, ncz-os]
  script:
    - ruff check .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

lint:backend-parity:
  stage: lint
  tags: [argos, ncz-os]
  script:
    - python3 scripts/generate_backend_parity_matrix.py
    - git diff --exit-code -- docs/BACKEND_PARITY.md
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

lint:oracle-method-move:
  stage: lint
  tags: [argos, ncz-os]
  variables:
    GIT_DEPTH: "0"
  script:
    - python3 tools/verify_method_move.py --report
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

lint:import-linter:
  stage: lint
  tags: [argos, ncz-os]
  script:
    - lint-imports --config pyproject.toml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

lint:migration-parity:
  stage: lint
  tags: [argos, ncz-os]
  script:
    - python3 scripts/check_migration_parity.py --mode full
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

lint:env-discipline:
  stage: lint
  tags: [argos, ncz-os]
  script:
    - |
      # Runtime environment reads must route through mnemos/core/config.py.
      # Allowed exceptions:
      #   - mnemos/installer/* runs before package configuration exists.
      #   - tests/* may set process environment for test isolation (outside mnemos/).
      if grep -RInE '(^|[^[:alnum:]_])_?os\.(environ|getenv)' mnemos --exclude-dir=installer | grep -v '^mnemos/core/config.py:'; then
        echo "Forbidden os.environ/os.getenv usage outside mnemos/core/config.py or mnemos/installer/."
        exit 1
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---- test --------------------------------------------------------------

test:unit:
  stage: test
  tags: [argos, ncz-os]
  script:
    - pytest tests/
        --tb=short
        --ignore=tests/test_live_e2e.py
        --junitxml=junit.xml
        -q
  artifacts:
    when: always
    reports:
      junit: junit.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Critical-path coverage gate for the required-audit write path
# (mnemos/audit/route_helper.py and mnemos/audit/writer.py). This is a
# SCOPED gate -- NOT a global coverage threshold -- and its only job is
# to fail the build if a future regression removes or skips a test that
# exercises one of the audit-write branches. The whole point is that a
# regression on THIS file specifically fails the build even when
# overall coverage is not tracked anywhere else.
#
# Test selection: every test that exercises code in mnemos/audit/ --
# the named files are the complete audit-module test surface (route
# helper, writer, crypto, merkle proof, repo methods, sealer, endpoints,
# health, token startup warning, universal chain, plus the required-
# mutation regressions). The verification command
# ``pytest tests/test_audit_route_helper.py tests/test_required_audit_mutations.py``
# is the minimum must-pass subset and is a strict subset of this list.
#
# Threshold: 100% statement and branch coverage, without audit exclusions.
# Driver dispatch is tested with real repository constructors and an isolated
# writer spy; this does not replace live backend persistence qualification.
test:audit-coverage-gate:
  stage: test
  tags: [argos, ncz-os]
  script:
    # Tests that exercise code in mnemos/audit/. Ordered so the two
    # named must-pass files (test_audit_route_helper.py + the required
    # mutation regression set) run first; the rest is the broader
    # audit-module test surface that this gate's 100% coverage target
    # depends on for crypto.py / merkle_* / etc.
    - pytest
        tests/test_audit_route_helper.py
        tests/test_required_audit_mutations.py
        tests/test_audit_writer.py
        tests/test_audit_crypto.py
        tests/test_audit_merkle_proof.py
        tests/test_audit_repo_methods.py
        tests/test_audit_sealer.py
        tests/test_audit_endpoints.py
        tests/test_audit_health.py
        tests/test_audit_token_startup_warning.py
        tests/test_universal_audit_chain.py
        --tb=short
        --cov=mnemos/audit
        --cov-branch
        --cov-fail-under=100
        -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  # REQUIRED: a future regression on mnemos/audit/route_helper.py or
  # writer.py must fail the build even when overall coverage is not
  # tracked anywhere else. Do NOT add allow_failure: true.

test:integration:
  stage: test
  tags: [argos, ncz-os]
  services:
    - name: pgvector/pgvector:pg17
      alias: postgres
      variables:
        POSTGRES_PASSWORD: test
        POSTGRES_DB: mnemos_test
        POSTGRES_USER: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    PGHOST: postgres
    PGUSER: postgres
    PGPASSWORD: test
    PGDATABASE: mnemos_test
    DATABASE_URL: "postgresql://postgres:test@postgres:5432/mnemos_test"
    MNEMOS_TEST_DB: "postgresql://postgres:test@postgres:5432/mnemos_test"
    RATE_LIMIT_STORAGE_URI: "redis://redis:6379/0"
  before_script:
    - python3 -m venv .venv
    - .venv/bin/pip install --cache-dir=.cache/pip -q -e ".[dev,sqlite,nats,persephone]"
    - export PATH="$CI_PROJECT_DIR/.venv/bin:$PATH"
    # Wait for Postgres to accept connections (pgvector image does not
    # signal readiness; poll until psql connects).
    - |
      for i in $(seq 1 30); do
        if pg_isready -h postgres -U postgres -t 1 >/dev/null 2>&1; then
          echo "postgres ready"; break
        fi
        sleep 1
      done
    # Pre-create roles that mnemos/installer/db.py creates before migrations.
    # The migrations themselves GRANT to these roles but do not create them, so
    # CI must seed them first or migrations_v1_multiuser.sql:193 fails.
    - |
      psql -h postgres -U postgres -d mnemos_test -v ON_ERROR_STOP=1 <<'SQL'
      DO $$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'mnemos_user') THEN
          CREATE ROLE mnemos_user LOGIN PASSWORD 'test';
        END IF;
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'mnemos') THEN
          CREATE ROLE mnemos LOGIN PASSWORD 'test';
        END IF;
      END $$;
      SQL
    # Apply migrations in the canonical order.
    # F18 fix: the previous inline list referenced ``db/migrations.sql``
    # and friends at a top-level ``db/`` directory that does not exist
    # in this repo. The on-disk path is ``mnemos/db_migrations/`` (the
    # flat v1..v5 files) and ``mnemos/db_migrations/migrations/`` (the
    # numbered-series files). The old loop silently skipped every file
    # (``if [ -f "$f" ]; then ... else echo "skip $f"; fi``), so the
    # test passed against an empty database — a worse failure mode
    # than a hard error.
    #
    # The canonical migration list lives in ``mnemos/installer/db.py``
    # and is pinned by ``tests/test_migration_lists_sync.py``. The
    # helper below resolves that list, verifies every path exists on
    # disk (FAIL on any missing — silently skipping a real check is
    # worse than a strict job), and applies via psql with
    # ``ON_ERROR_STOP=1``.
    - python3 scripts/ci_apply_postgres_migrations.py --dsn "$DATABASE_URL"
  script:
    # These regressions create disposable databases and run actual SQL. They
    # deliberately fail if the configured PostgreSQL service cannot be reached.
    - pytest tests/test_postgres_concurrent_migration_race.py tests/test_federation_journal.py tests/test_required_audit_mutations.py tests/test_morpheus_job_queue.py tests/test_morpheus_consolidation_isolation.py --tb=short -q --junitxml=junit-regressions.xml
    - pytest tests/ -m integration --tb=short -q --junitxml=junit-integration.xml || EXIT=$?
    - |
      # If no integration-marked tests exist yet, exit code 5 ("no tests collected")
      # is acceptable. Anything else fails the job.
      if [ "${EXIT:-0}" = "5" ]; then
        echo "no @pytest.mark.integration tests yet — passing"
        exit 0
      fi
      exit "${EXIT:-0}"
  artifacts:
    when: always
    reports:
      junit: junit-integration.xml
    expire_in: 1 week
  # Needs Postgres/Redis docker services; the ARGOS shell executor cannot
  # provide them (services: are ignored on a shell runner). Run only when a
  # docker-executor runner is available and RUN_DB_TESTS is set.
  rules:
    - if: $RUN_DB_TESTS == "true"

test:persistence-parity:
  stage: test
  tags: [argos, ncz-os]
  services:
    - name: pgvector/pgvector:pg17
      alias: postgres
      variables:
        POSTGRES_PASSWORD: test
        POSTGRES_DB: mnemos_test
        POSTGRES_USER: postgres
  variables:
    PGHOST: postgres
    PGUSER: postgres
    PGPASSWORD: test
    PGDATABASE: mnemos_test
    DATABASE_URL: "postgresql://postgres:test@postgres:5432/mnemos_test"
    MNEMOS_TEST_DB: "postgresql://postgres:test@postgres:5432/mnemos_test"
  before_script:
    - python3 -m venv .venv
    - .venv/bin/pip install --cache-dir=.cache/pip -q -e ".[dev,sqlite]"
    - export PATH="$CI_PROJECT_DIR/.venv/bin:$PATH"
    - |
      for i in $(seq 1 30); do
        if pg_isready -h postgres -U postgres -t 1 >/dev/null 2>&1; then
          echo "postgres ready"; break
        fi
        sleep 1
      done
    - |
      psql -h postgres -U postgres -d mnemos_test -v ON_ERROR_STOP=1 <<'SQL'
      DO $$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'mnemos_user') THEN
          CREATE ROLE mnemos_user LOGIN PASSWORD 'test';
        END IF;
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'mnemos') THEN
          CREATE ROLE mnemos LOGIN PASSWORD 'test';
        END IF;
      END $$;
      SQL
    # F18 fix: the previous inline reference prepended ``db/`` to each
    # basename. That directory has not existed in this repo for several
    # versions — the canonical paths are under ``mnemos/db_migrations/``.
    # The parity arm now resolves the installer's migration list and
    # applies each path with the correct prefix, FAILING on any missing
    # path (consistent with the integration arm above; silently skipping
    # was strictly worse than a hard failure).
    - python3 scripts/ci_apply_postgres_migrations.py --dsn "$DATABASE_URL"
  script:
    - pytest tests/test_persistence_parity.py --tb=short -q --junitxml=junit-persistence-parity.xml
  artifacts:
    when: always
    reports:
      junit: junit-persistence-parity.xml
    expire_in: 1 week
  # Needs Postgres/Redis docker services; the ARGOS shell executor cannot
  # provide them (services: are ignored on a shell runner). Run only when a
  # docker-executor runner is available and RUN_DB_TESTS is set.
  rules:
    - if: $RUN_DB_TESTS == "true"

test:multi-worker:
  stage: test
  tags: [argos, ncz-os]
  variables:
    COMPOSE_PROJECT_NAME: mnemos-mw-$CI_PIPELINE_ID
    POSTGRES_PASSWORD: mnemos_local
  before_script: []
  script:
    - |
      cat > docker-compose.multi-worker.ci.yml <<'YAML'
      services:
        postgres:
          # Drop the base compose's fixed host-port publish (127.0.0.1:5432:5432).
          # COMPOSE_PROJECT_NAME makes container names pipeline-unique, but the
          # host port is not — concurrent pipelines on the shared runner collide
          # ("failed to bind host port 127.0.0.1:5432: address already in use").
          # The multi-worker smoke reaches postgres over the compose network
          # (PG_HOST: postgres), so no host publish is needed. Requires Compose
          # >= 2.24 for the !reset tag (ARGOS runner is 2.40).
          ports: !reset []
          # The base compose's initdb.d mounts are incomplete for a *fresh*
          # DB, so `docker compose up` on a clean volume aborts (postgres
          # exit 3) before this smoke job can run. Two gaps, both patched
          # here for the throwaway CI database (volumes merge by append, so
          # the base initdb mounts are preserved):
          #
          #   1. Role seed. initdb only creates POSTGRES_USER=mnemos_user,
          #      but migrations_model_registry.sql (and others) GRANT to a
          #      bare `mnemos` role. Same script docker-compose.staging.yml
          #      mounts; sorts before 01-schema.sql.
          #   2. hive_agents create. 0036-hive-agents-subscription-pools
          #      ALTERs hive_agents, but the base compose never mounts the
          #      migration that CREATEs it. 0021_hive_agents.sql is the
          #      cross-backend (pg/oracle/db2) numbered-series creator that
          #      0036 belongs to; the "655-" prefix sorts it after the
          #      subscription tables and before 66-0036.
          #
          # NOTE (follow-up): the canonical runner mnemos/installer/db.py has
          # the same fresh-init gap for hive/full deploys (includes 0036 but
          # not the hive_agents creator). That is a production-deploy fix that
          # needs a lineage decision (0021 numbered-series vs the flat
          # migrations_v6_0_hive_mind.sql) and is tracked separately; this
          # override only makes the CI smoke DB init.
          volumes:
            - ./mnemos/db_migrations/0_init_roles_staging.sql:/docker-entrypoint-initdb.d/00-init-roles.sql
            - ./mnemos/db_migrations/migrations/0021_hive_agents.sql:/docker-entrypoint-initdb.d/655-hive-agents-create.sql

        redis:
          image: redis:7-alpine
          healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 2s
            timeout: 2s
            retries: 30

        mnemos:
          # The shipped image never installs the optional `redis` extra
          # (pyproject.toml keeps it opt-in — most single-worker deployments
          # don't need it). This job's whole point is multi-worker mode,
          # which docs/SCALING.md documents as requiring Redis-backed rate
          # limiting, so RATE_LIMIT_STORAGE_URI below is redis:// on
          # purpose. Without the package, mnemos crashes at import time
          # constructing the rate limiter: "'redis' prerequisite not
          # available" (reproduced 2026-09-14 on the real ARGOS runner).
          # Install it before serving rather than rebuilding the shipped
          # image with a permanently-larger default footprint.
          command:
            - /bin/sh
            - -c
            - "pip install --no-cache-dir 'redis>=5.0.0' && exec mnemos serve --host 0.0.0.0 --workers 2"
          # Same host-port collision as postgres above: the base compose
          # publishes 0.0.0.0:5002, so concurrent pipelines on the shared
          # runner collide ("Bind for 0.0.0.0:5002 failed: port is already
          # allocated"). The smoke container reaches mnemos over the compose
          # network (http://mnemos:5002), so drop the host publish.
          ports: !reset []
          environment:
            RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
            MNEMOS_WORKERS: "2"
            WEBHOOK_ALLOW_PRIVATE_HOSTS: "true"
            PG_POOL_MIN: "1"
            PG_POOL_MAX: "8"
            # This compose override predates mnemos/core/network_guard.py's
            # bind-refusal check (mnemos serve refuses to bind 0.0.0.0
            # without auth configured). Without this, the mnemos container
            # crash-loops on every restart — reproduced 2026-09-14 on the
            # real ARGOS runner: "mnemos serve refuses to bind 0.0.0.0 with
            # authentication disabled". This service is reachable only on
            # the compose-internal network (ports: !reset [], no host
            # publish), not the internet — exactly the guard's own
            # documented escape-hatch case.
            MNEMOS_ALLOW_UNAUTHENTICATED_NETWORK_BIND: "1"
          depends_on:
            redis:
              condition: service_healthy

        smoke:
          image: curlimages/curl:8.10.1
          entrypoint: ["/bin/sh", "-lc"]
          depends_on:
            mnemos:
              condition: service_started
      YAML
    - docker compose -f docker-compose.yml -f docker-compose.multi-worker.ci.yml up -d --build redis mnemos
    - |
      # --no-deps is required. Without it `run` re-resolves the smoke service's
      # depends_on and RECREATES the mnemos container that `up` just started:
      # the trace shows "Container mnemos-1 Recreate/Recreated/Started" a
      # fraction of a second before the smoke's first probe, so the smoke was
      # racing a container that was still booting. The health loop below
      # tolerates a slow start; it cannot tolerate its target being replaced
      # underneath it.
      #
      # Each step echoes a marker first. When this job fails the trace shows
      # only curl's exit code, which does not say *which* call failed -- an
      # HTTP 409 could be the health probe, the memory POST or the webhook
      # POST, and they mean very different things.
      docker compose -f docker-compose.yml -f docker-compose.multi-worker.ci.yml run --rm --no-deps smoke '
        set -eu
        ready=0
        for _i in $(seq 1 60); do
          if curl -fsS http://mnemos:5002/health >/tmp/health.json; then
            ready=1
            break
          fi
          sleep 2
        done
        echo "SMOKE: health ready=$ready"
        test "$ready" = "1"
        echo "SMOKE: POST /v1/memories"
        curl -fsS -X POST http://mnemos:5002/v1/memories \
          -H "Content-Type: application/json" \
          -d "{\"content\":\"multi-worker smoke memory\",\"category\":\"ci\"}" \
          >/tmp/memory.json
        echo "SMOKE: GET /v1/memories"
        curl -fsS "http://mnemos:5002/v1/memories?limit=5" >/tmp/memories.json
        echo "SMOKE: POST /v1/webhooks"
        curl -fsS -X POST http://mnemos:5002/v1/webhooks \
          -H "Content-Type: application/json" \
          -d "{\"url\":\"http://127.0.0.1:9/webhook\",\"events\":[\"memory.created\"],\"description\":\"multi-worker smoke\"}" \
          >/tmp/webhook.json
        echo "SMOKE: all steps passed"
      '
    - docker compose -f docker-compose.yml -f docker-compose.multi-worker.ci.yml logs --no-color mnemos
  after_script:
    - docker compose -f docker-compose.yml -f docker-compose.multi-worker.ci.yml down -v --remove-orphans || true
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---- build -------------------------------------------------------------

build:docker:
  stage: build
  tags: [argos, ncz-os]
  before_script: []
  script:
    - docker build -t mnemos-os:$CI_COMMIT_SHORT_SHA .
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ---- oracle smoke (M7) -------------------------------------------------
test:oracle-smoke:
  stage: test
  tags: [argos, ncz-os]
  script:
    - python3 -m venv .venv && .venv/bin/pip install -q oracledb && export PATH="$CI_PROJECT_DIR/.venv/bin:$PATH"
    - |
      python -c '
      import oracledb
      conn = oracledb.connect("mnemos/mnemos_dev@oracle:1521/FREEPDB1")
      cur = conn.cursor()
      cur.execute("SELECT COUNT(*) FROM memories")
      print("Oracle memories:", cur.fetchone()[0])
      conn.close()
      print("Oracle smoke passed")
      '
  # Needs a reachable Oracle at host `oracle:1521` (a docker-service alias).
  # The ARGOS shell runner provides no such service, so this opportunistic
  # smoke only runs when explicitly enabled with a live Oracle in reach.
  rules:
    - if: $RUN_ORACLE_SMOKE == "true"


# Portable SQL journals must run against real engines on every branch.
# SaaS Docker runners supply these disposable services, independently of fleet DBs.
test:journal-sql:
  stage: test
  image: python:3.13-slim
  services:
    - name: $JOURNAL_DATABASE_IMAGE
      alias: journal-db
  parallel:
    matrix:
      - JOURNAL_DATABASE_IMAGE: ["mysql:9.1"]
        JOURNAL_DIALECT: ["mysql"]
      - JOURNAL_DATABASE_IMAGE: ["mariadb:12.3"]
        JOURNAL_DIALECT: ["mariadb"]
  variables:
    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
    MNEMOS_EMBEDDING_DIM: "3"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential cmake
    - python -m pip install --quiet -e ".[dev,sqlite,mysql]"
    - |
      if [ "$JOURNAL_DIALECT" = mysql ]; then
        export MNEMOS_TEST_MYSQL_DSN="mysql://root@journal-db:3306/mysql"
      else
        export MNEMOS_TEST_MARIADB_DSN="mariadb://root@journal-db:3306/mysql"
      fi
  script:
    - python -m pytest tests/test_federation_journal.py tests/test_morpheus_backend_live.py tests/test_mysql_trigger_splitter.py -k "$JOURNAL_DIALECT or splitter" --tb=short -q --junitxml=journal-sql.xml
  artifacts:
    when: always
    reports:
      junit: journal-sql.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH


# Validate the supported combined install as well as the core-only contract.
test:composition:
  stage: test
  image: python:3.13-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git build-essential cmake
    - |
      python - <<'PYTHON'
      import json
      import subprocess
      from pathlib import Path
      pins = json.loads(Path(".github/addons.lock.json").read_text())
      for name in ("graeae", "knemon", "pantheon"):
          target = "../composition-" + name
          subprocess.run(["git", "clone", "https://gitlab.com/ncz-os/" + name + ".git", target], check=True)
          subprocess.run(["git", "-C", target, "checkout", pins[name]], check=True)
      PYTHON
    - python -m pip install --quiet -e ".[dev,sqlite,nats,persephone]" -e ../composition-graeae -e ../composition-knemon -e ../composition-pantheon
  script:
    - lint-imports --config pyproject.toml
    - python -m pytest tests/ --ignore=tests/test_live_e2e.py --tb=short -q --junitxml=composition.xml
  artifacts:
    when: always
    reports:
      junit: composition.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
